# NPM-facing side-car for the GraphQL API.
# NPM proxy host: api.digital-card.example.com -> digital-card-server-web (http, port 80).

upstream digital_card_server { server digital-card-server:3000; }

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;
    client_body_timeout  60s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    location = /health { proxy_pass http://digital_card_server; access_log off; }

    location / { proxy_pass http://digital_card_server; }
}
