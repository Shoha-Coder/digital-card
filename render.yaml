databases:
  - name: digital-card-db
    plan: free
    databaseName: digital_card
    user: digital_card

services:
  - type: web
    name: digital-card
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: digital-card-db
          property: connectionString
      - key: PORT
        value: 3000
